<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026-07-25 每日彙整</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0f1117; color:#e8eaf0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.7; }
  .wrap { max-width:820px; margin:0 auto; padding:32px 20px 64px; }
  .nav { font-size:14px; margin-bottom:24px; }
  .nav a { color:#4f6ef7; text-decoration:none; }
  .nav a:hover { text-decoration:underline; }
  h1 { font-size:26px; margin:0 0 8px; }
  .empty { margin-top:40px; padding:40px 24px; text-align:center; background:#1e2130; border-radius:12px; color:#a0aec0; }
  .empty .big { font-size:40px; margin-bottom:12px; }
  footer { margin-top:48px; font-size:12px; color:#6b7280; border-top:1px solid #232635; padding-top:16px; }
  .analyze-btn {
    display: inline-block; margin-top: 8px; padding: 6px 14px;
    background: transparent; border: 1px solid #4f6ef7; border-radius: 6px;
    color: #a0aec0; font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  .analyze-btn:hover { background: rgba(79,110,247,0.13); color: #e8eaf0; }
  .copy-toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #4f6ef7; color: white; padding: 10px 20px;
    border-radius: 8px; font-size: 14px; z-index: 9999;
    transition: opacity 0.5s; opacity: 1;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="../../index.html">← 返回總覽</a></div>
  <h1>2026 年 07 月 25 日　星期六</h1>
  <div class="empty">
    <div class="big">🗒️</div>
    <div>今天的「每日記錄」資料夾沒有內容。</div>
    <div style="margin-top:6px;font-size:13px;">把 PDF、照片、網址或筆記放進 Google Drive 的今日資料夾，晚上會自動彙整於此。</div>
  </div>
  <footer>生成時間：2026-07-25 18:03（台灣時間）</footer>
</div>
<script>
function requestAnalysis(btn, date, title) {
  const text = '幫我深度分析 ' + date + ' 的 PDF：' + title;
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent; btn.textContent = '已複製 ✓';
    setTimeout(() => btn.textContent = orig, 2000);
    showToast('✅ 已複製！請貼給 Claude');
  });
}
function showToast(msg) {
  const t = document.createElement('div'); t.className = 'copy-toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; }, 2000);
  setTimeout(() => { t.remove(); }, 2500);
}
</script>
</body>
</html>
